<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="image">
        <img src="styles/side-image.jpg" alt="Soap and sea sponge stacked in a still life against a plain background."
        width="500" height="102.5%">
    </div>

    <main>
        <div class="intro-text">
            <p> This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.
                <br> </br>
                You <em> know </em> you want to.
            </p>
        </div>

        <form>
            <h3> Let's do this! </h3>

            <div class="names">
                <div class="field">
                    <label for="first-name"> First name </label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>

                <div class="field">
                    <label for="last-name"> Last name </label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </div>

            <div class="contact">
                <div class="field">
                    <label for="user_email"> Email </label>
                    <input type="email" id="user_email" name="email" required>
                </div>

                <div class="field">
                    <label for="phone-number"> Phone number </label>
                    <input type="tel" id="phone-number" name="phone-number">
                </div>
            </div>

            <div class="password">
                <div class="field">
                    <label for="user_password"> Password </label>
                    <input type="password" id="user_password" name="password" required>
                </div>

                <div class="field">
                    <label for="confirm-password"> Confirm password </label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
            </div>

            <button> Create Account </button>

        </form>

        <div class="ending-text">
            Already have an account? Log in
        </div>
    </main>


</body>

</html>
