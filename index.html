<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="image">
        <img src="styles/side-image.jpg" alt="Soap and sea sponge stacked in a still life against a plain background."
        width="400" height="600">
    </div>

    <main>
        <div class="intro-text">
            <p> This is not a real online service! You know you need something
            like this in your life to help you realize your deepest dreams.
            Sign up <em>now</em> to get started. You know you want to. </p>
        </div>

        <form>
            <h3> Let's do this! </h3>

            <div class="names">
                <label for="first-name"> First name </label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name"> Last name </label>
                <input type="text" id="last-name" name="last-name" required>
            </div>

            <div class="contact">
                <label for="user_email"> Email </label>
                <input type="email" id="user_email" name="email" required>

                <label for="phone-number"> Phone number </label>
                <input type="tel" id="phone-number" name="phone-number">
            </div>

            <div class="password">
                <label for="user_password"> Password </label>
                <input type="password" id="user_password" name="password" required>

                <label for="confirm-password"> Confirm password </label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <button> Create Account </button>

        </form>

        <div class="ending-text">
            Already have an account? Log in
        </div>
    </main>


</body>

</html>
