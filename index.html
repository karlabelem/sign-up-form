<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="image">
        <img src="styles/side-image.jpg" alt="Soap and sea sponge stacked in a still life against a plain background.">
    </div>

    <main>
        <div class="intro-text">
            <p> This is not a real online service, but consider it your invitation
                to a quiet ritual — a moment set aside just for&nbsp;you.
                Begin <em>now</em>, if you're ready.
                <br> </br>
                You <em> know </em> you deserve this.
            </p>
        </div>

        <div class="form-card">
            <form>
                <h3> Take a moment </h3>
            
                <div class="names">
                    <div class="field">
                        <label for="first-name"> FIRST NAME </label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>

                    <div class="field">
                        <label for="last-name"> LAST NAME </label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>

                <div class="contact">
                    <div class="field">
                        <label for="user_email"> EMAIL </label>
                        <input type="email" id="user_email" name="email" required>
                    </div>

                    <div class="field">
                        <label for="phone-number"> PHONE NUMBER </label>
                        <input type="tel" id="phone-number" name="phone-number">
                    </div>
                </div>

                <div class="password">
                    <div class="field">
                        <label for="user_password"> PASSWORD </label>
                        <input type="password" id="user_password" name="password" required>
                    </div>

                    <div class="field">
                        <label for="confirm-password"> CONFIRM PASSWORD </label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>

            </form>
        </div>

        <button> Create Account </button>
        

        <div class="ending-text">
            Already have an account? Log in
        </div>
    </main>


</body>

</html>
